# Emerge Email Worker (cron)
#
# Sends the branded emails (welcome, re-engagement drip, verification grace
# lock) via SMTP. Verification and password-reset emails are sent natively by
# Firebase Auth from the app (see FirebaseAuthRepository) — the worker's
# verify/reset tasks are no longer scheduled. All tasks are idempotent via
# their markers, so this daily run is a safety net on top of the 5-minute
# emails-welcome.yml workflow.
#
# Required repo secrets:
#   FIREBASE_SERVICE_ACCOUNT_TRADEFLASH_L2966  service-account JSON (already
#                                              used by the hosting workflow)
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS  SMTP credentials
# Optional secrets:
#   EMAIL_FROM          sender address — MUST equal SMTP_USER (Gmail only
#                       DKIM-signs its own domain; any other From ends up in
#                       spam). If unset, sender.js falls back to SMTP_USER.
#   EMAIL_OVERRIDE_TO   NOT wired in this workflow — emails go to real
#                       recipients. (sender.js still supports it for local
#                       testing; it was removed from CI after the owner kept
#                       receiving every user's emails.)
name: Emails (welcome / re-engagement / verification grace)

on:
  schedule:
    - cron: "0 4 * * *" # daily 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-email-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: email-worker/package-lock.json

      - name: Install worker dependencies
        working-directory: email-worker
        run: npm ci

      - name: Run email tasks
        working-directory: email-worker
        env:
          # Secret passed as an env var (not echoed through a shell) so the
          # multi-line JSON arrives byte-for-byte intact.
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRADEFLASH_L2966 }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: node src/index.js --task welcome --task drip --task grace
