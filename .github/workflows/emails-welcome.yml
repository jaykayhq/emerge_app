# Emerge Email Worker (near-real-time)
#
# Verification and password-reset emails are sent HERE via SMTP with fully
# branded templates (see email-worker/src/tasks/verify.js and reset.js) —
# NOT by Firebase Auth's default email. Welcome is also delivered here.
#
# The app writes users/{uid}.verificationRequestedAt (verify) and
# email_requests/{id} docs of type password_reset; the 5-minute schedule
# picks them up, so delivery is ≤5 minutes after the request. Both tasks
# are command-driven: verify sends at most ONE email per request (only when
# verificationRequestedAt is newer than verificationEmailSentAt) and reset
# sends once per request doc (sentAt marker) — so the schedule never
# re-sends or spams.
#
# The repository_dispatch webhook trigger was removed with the
# github_dispatch.ts bridge (deleted 2026-08-16).
name: Emails (welcome / verify / reset — every 5 min)

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-email-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: email-worker/package-lock.json

      - name: Install worker dependencies
        working-directory: email-worker
        run: npm ci

      - name: Run welcome + verify + reset tasks
        working-directory: email-worker
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRADEFLASH_L2966 }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: node src/index.js --task welcome --task verify --task reset
