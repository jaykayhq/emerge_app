# Emerge Welcome + Verification Email Worker (near-real-time)
#
# Two triggers:
#   1. repository_dispatch — the tiny Cloud Function webhook bridge
#      (functions/src/github_dispatch.ts) fires "user-signed-up" on account
#      creation and "verification-requested" when the app asks for a
#      verification email. This gives near-instant delivery after signup.
#   2. schedule */5 — fallback so a failed dispatch never blocks delivery
#      (the tasks are idempotent via their markers).
# The repo is public → GitHub Actions minutes are unlimited (free).
name: Emails (welcome & verify — webhook + every 5 min)

on:
  repository_dispatch:
    types: [user-signed-up, verification-requested]
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes (fallback)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-email-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: email-worker/package-lock.json

      - name: Install worker dependencies
        working-directory: email-worker
        run: npm ci

      - name: Run welcome + verify tasks
        working-directory: email-worker
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRADEFLASH_L2966 }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: node src/index.js --task welcome --task verify
