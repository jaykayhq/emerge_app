# Emerge Email Worker (near-real-time)
#
# Welcome emails are delivered here via SMTP. Verification and password-reset
# emails are sent natively by Firebase Auth from the app (see
# FirebaseAuthRepository) — those worker tasks were removed from this
# schedule. The 5-minute cadence is kept for welcome delivery.
#
# EMAIL_FROM must equal SMTP_USER (Gmail only DKIM-signs its own domain;
# any other From lands in spam). If unset, sender.js falls back to SMTP_USER.
#
# The repository_dispatch webhook trigger was removed with the
# github_dispatch.ts bridge (deleted 2026-08-16).
name: Emails (welcome — every 5 min)

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-email-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: email-worker/package-lock.json

      - name: Install worker dependencies
        working-directory: email-worker
        run: npm ci

      - name: Run welcome task
        working-directory: email-worker
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRADEFLASH_L2966 }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: node src/index.js --task welcome
