name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Verify generated files are up to date
        run: |
          git diff --exit-code -- '*.g.dart' '*.freezed.dart' '*.mocks.dart' || \
          (echo "::error::Generated files are stale. Run 'flutter pub run build_runner build --delete-conflicting-outputs' and commit the results." && exit 1)

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run analyzer
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
