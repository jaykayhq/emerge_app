name: AI Challenge Rotation (Kilo agent)

# Dispatches a headless Kilo agent daily to execute
# docs/growth/challenge-rotation-runbook.md: generate images (polli), refresh
# affiliate links, rotate challenges in Firestore, and commit + push changes.
#
# Secrets required (GitHub → Settings → Secrets and variables → Actions):
#   KILO_GATEWAY_KEY        — API key kilo uses to run headless on this runner
#                             (your Kilo Gateway key or OpenCode Go key).
#                             Passed as both OPENCODE_API_KEY and KILO_API_KEY.
#   POLLINATIONS_API_KEY    — polli image generation key.
#   FIREBASE_SERVICE_ACCOUNT_TRADEFLASH_L2966 — existing Firebase SA (JSON).

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {} # manual "Run workflow" button

jobs:
  ai-rotation:
    runs-on: ubuntu-latest
    permissions:
      contents: write # so the agent can commit + push its changes
    steps:
      - uses: actions/checkout@v4 # persists GITHUB_TOKEN for push-back

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Kilo CLI + polli
        run: |
          npm install -g @kilocode/cli
          npm install -g @pollinations/cli@latest

      - name: Authenticate polli
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: printf '%s' "$POLLINATIONS_API_KEY" | polli auth login --with-token

      - name: Run AI rotation agent
        env:
          OPENCODE_API_KEY: ${{ secrets.KILO_GATEWAY_KEY }}
          KILO_API_KEY: ${{ secrets.KILO_GATEWAY_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRADEFLASH_L2966 }}
        run: |
          kilo run --auto --print-logs \
            "Execute docs/growth/challenge-rotation-runbook.md in CI mode.

            1. If scripts/rotation/ does not exist yet, create the files exactly as the runbook specifies.
            2. Write the Firebase service account JSON from the FIREBASE_SERVICE_ACCOUNT_JSON env var to \$HOME/firebase-sa.json, then export GOOGLE_APPLICATION_CREDENTIALS=\$HOME/firebase-sa.json for every command that needs it.
            3. Generate any missing challenge images with polli into scripts/rotation/images/ matching each template's imageFile name (use POLLINATIONS_API_KEY). If polli is unavailable or fails, skip generation and rely on the template's fallback imageUrl — never let image generation block the run.
            4. Run the rotation: npm --prefix scripts/rotation install && node scripts/rotation/index.js.
            5. Verify: Firestore challenges docs carry fresh status/imageUrl/affiliateUrl/sponsor/sponsorshipEndDate.
            6. Commit all changes (scripts/, images, storage.rules if changed) and push to the current branch.
            7. Finish with a one-line summary: upserts / updates / notified."
